server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 单页应用：任何路径都回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的构建产物可长期缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
